services:
  - type: web
    name: p4p-customer
    plan: free
    runtime: node
    buildCommand: pnpm install && pnpm --filter @p4p/shared build && pnpm --filter @p4p/db build && pnpm --filter @p4p/customer build && pnpm --filter @p4p/db db:push
    startCommand: pnpm --filter @p4p/customer start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_MODE
        value: sandbox
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: p4p-ops
    plan: free
    runtime: node
    buildCommand: pnpm install && pnpm --filter @p4p/shared build && pnpm --filter @p4p/db build && pnpm --filter @p4p/ops build
    startCommand: pnpm --filter @p4p/ops start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_ADDRESS
        sync: false
      - key: QUICKBOOKS_CLIENT_ID
        sync: false
      - key: QUICKBOOKS_CLIENT_SECRET
        sync: false
      - key: QUICKBOOKS_REDIRECT_URI
        sync: false
      - key: QUICKBOOKS_ENVIRONMENT
        value: sandbox
      - key: GEMINI_API_KEY
        sync: false
